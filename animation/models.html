<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Низ четирите архитектури — тензор по тензор</title>

<style>
:root{
  --u: 1s;
  --bg:#E9ECF0; --surface:#F6F8FA; --surface-2:#DFE4EA; --line:#C4CCD5; --line-soft:#D8DEE5;
  --ink:#121A23; --ink-2:#45525E; --muted:#6C7A87;
  --accent:#1B6E8A; --measured:#A9631C; --good:#2A7355; --risk:#A93A28;
  --m1:#2C68BC; --m2:#A03F66; --m3:#1F7A5E; --m4:#87601D;
  --model:var(--m1);
  --sans:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","Cascadia Code",Consolas,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C131A; --surface:#141D26; --surface-2:#1C2833; --line:#2C3A47; --line-soft:#223039;
    --ink:#E6EDF3; --ink-2:#AEBDC9; --muted:#7F91A0;
    --accent:#4FB6CD; --measured:#DFA05C; --good:#5CC79A; --risk:#F07C6C;
    --m1:#6FA9F0; --m2:#E68CAD; --m3:#5DC6A3; --m4:#D8AD64;
  }
}
:root[data-theme="dark"]{
  --bg:#0C131A; --surface:#141D26; --surface-2:#1C2833; --line:#2C3A47; --line-soft:#223039;
  --ink:#E6EDF3; --ink-2:#AEBDC9; --muted:#7F91A0;
  --accent:#4FB6CD; --measured:#DFA05C; --good:#5CC79A; --risk:#F07C6C;
  --m1:#6FA9F0; --m2:#E68CAD; --m3:#5DC6A3; --m4:#D8AD64;
}

*,*::before,*::after{ box-sizing:border-box }
html,body{ height:100% }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased }
:focus-visible{ outline:2px solid var(--model); outline-offset:2px; border-radius:3px }
.app{ height:100dvh; display:grid; grid-template-rows:auto 1fr auto auto }

/* заглавие */
.bar{ display:flex; align-items:center; gap:1rem; flex-wrap:wrap; padding:.6rem clamp(.9rem,2.5vw,1.5rem);
  background:var(--surface); border-bottom:1px solid var(--line) }
.brand{ display:flex; align-items:baseline; gap:.6rem; min-width:0 }
.brand b{ font-size:.98rem; letter-spacing:-.015em; white-space:nowrap }
.brand a{ font-family:var(--mono); font-size:.68rem; color:var(--muted); text-decoration:none; border-bottom:1px dotted var(--line) }
.brand a:hover{ color:var(--accent); border-color:var(--accent) }
.tabs{ display:flex; gap:.3rem; margin-left:auto; flex-wrap:wrap }
.tabs button{ font:inherit; font-family:var(--mono); font-size:.72rem; padding:.3rem .6rem; cursor:pointer;
  background:transparent; color:var(--muted); border:1px solid transparent; border-bottom:2px solid var(--line-soft); border-radius:2px }
.tabs button:hover{ background:var(--surface-2); color:var(--ink) }
.tabs button[aria-current="true"]{ color:var(--c); border-bottom-color:var(--c); font-weight:700 }

/* сцена */
.stage{ display:grid; grid-template-columns:minmax(0,1.42fr) minmax(300px,.82fr); gap:1rem;
  padding:clamp(.8rem,2vw,1.3rem) clamp(.9rem,2.5vw,1.5rem); overflow:hidden }
@media (max-width:1000px){ .stage{ grid-template-columns:1fr; grid-template-rows:auto 1fr; overflow:auto } }

.viz{ background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:.7rem .8rem;
  display:flex; flex-direction:column; min-width:0; overflow:auto }
.viz svg{ display:block; width:100%; height:auto; margin:auto; min-width:520px }

.panel{ display:flex; flex-direction:column; gap:.7rem; min-width:0; overflow:auto }
.step-no{ font-family:var(--mono); font-size:.7rem; letter-spacing:.15em; text-transform:uppercase; color:var(--muted);
  display:flex; align-items:center; gap:.55rem }
.step-no::before{ content:""; width:1.4rem; height:2px; background:var(--model); flex:none }
h2{ font-size:clamp(1.05rem,1.9vw,1.35rem); line-height:1.2; letter-spacing:-.02em; margin:0; text-wrap:balance }
.shape{ font-family:var(--mono); font-size:.82rem; background:var(--surface); border:1px solid var(--line);
  border-radius:3px; padding:.5rem .6rem; display:flex; flex-wrap:wrap; align-items:center; gap:.45rem; overflow-x:auto }
.shape b{ color:var(--model); font-weight:600; white-space:nowrap }
.shape span{ color:var(--muted) }
.body{ font-size:.9rem; color:var(--ink-2); margin:0 }
.body b{ color:var(--ink); font-weight:600 }
.body + .body{ margin-top:-.2rem }
.src{ font-family:var(--mono); font-size:.7rem; color:var(--muted); border-top:1px solid var(--line-soft); padding-top:.5rem; word-break:break-word }
code{ font-family:var(--mono); font-size:.88em; background:var(--surface-2); padding:.05em .3em; border-radius:2px; color:var(--ink) }

/* 'рбет' на моделот */
.spine{ display:flex; gap:2px; padding:0 clamp(.9rem,2.5vw,1.5rem) .5rem; flex-wrap:wrap }
.spine button{ flex:1 1 0; min-width:9px; height:16px; padding:0; cursor:pointer; border:none; border-radius:2px;
  background:var(--surface-2); position:relative }
.spine button:hover{ background:var(--line) }
.spine button[aria-current="true"]{ background:var(--model) }
.spine button.done{ background:color-mix(in srgb, var(--model) 42%, var(--surface-2)) }

/* транспорт */
.transport{ display:flex; align-items:center; gap:.8rem; flex-wrap:wrap; padding:.5rem clamp(.9rem,2.5vw,1.5rem);
  background:var(--surface); border-top:1px solid var(--line) }
.transport button{ font:inherit; cursor:pointer; background:var(--surface-2); color:var(--ink); border:1px solid var(--line);
  border-radius:3px; padding:.28rem .6rem; min-width:2.1rem }
.transport button:hover{ border-color:var(--model); color:var(--model) }
#play{ min-width:2.6rem; font-weight:700 }
.count{ font-family:var(--mono); font-size:.72rem; color:var(--muted); white-space:nowrap }
.progress{ flex:1 1 140px; height:3px; background:var(--surface-2); border-radius:2px; overflow:hidden; min-width:80px }
.progress i{ display:block; height:100%; width:0; background:var(--model) }
.speeds{ display:flex; gap:.2rem }
.speeds button{ font-family:var(--mono); font-size:.7rem; padding:.24rem .4rem; min-width:0 }
.speeds button[aria-pressed="true"]{ border-color:var(--model); color:var(--model); font-weight:700 }

/* SVG */
svg text{ font-family:var(--mono); fill:var(--muted); font-size:10px }
svg text.lbl{ fill:var(--ink-2); font-size:11px }
svg text.big{ fill:var(--ink); font-size:12px; font-weight:600 }
svg .axis{ stroke:var(--line); stroke-width:1 }

/* влез на елементи */
.fade{ opacity:0; animation:fin calc(.5*var(--u)) ease-out both; animation-delay:calc(var(--d,0)*.09*var(--u)) }
@keyframes fin{ from{ opacity:0; transform:translateY(5px) } to{ opacity:1; transform:none } }
.grow{ animation:gro calc(.55*var(--u)) cubic-bezier(.2,.9,.2,1) both; animation-delay:calc(var(--d,0)*.05*var(--u)) }
@keyframes gro{ from{ opacity:0; transform:scale(.5) } to{ opacity:1; transform:none } }
.pen{ animation:pen calc(1.5*var(--u)) ease-out both; animation-delay:calc(var(--d,0)*.09*var(--u)) }
@keyframes pen{ from{ stroke-dashoffset:var(--len,300) } to{ stroke-dashoffset:0 } }
.beat{ animation:beat calc(1.7*var(--u)) ease-in-out infinite; animation-delay:calc(var(--d,0)*.09*var(--u)) }
@keyframes beat{ 0%,100%{ opacity:.3 } 50%{ opacity:1 } }
.slide{ animation:sli calc(4*var(--u)) cubic-bezier(.45,0,.55,1) infinite }
@keyframes sli{ 0%{ transform:translateX(0) } 85%,100%{ transform:translateX(var(--tx,80px)) } }

@media (prefers-reduced-motion: reduce){
  .fade,.grow,.pen{ animation-duration:1ms !important; animation-delay:0ms !important }
  .beat,.slide{ animation:none; opacity:1 }
}
</style>

<div class="app">
  <header class="bar">
    <div class="brand">
      <b>Низ четирите архитектури — тензор по тензор</b>
      <a href="index.html">← преглед на пајплајнот</a>
    </div>
    <nav class="tabs" id="tabs" aria-label="Модели"></nav>
  </header>

  <main class="stage">
    <div class="viz"><svg id="viz" viewBox="0 0 900 330" role="img" aria-labelledby="vizTitle"><title id="vizTitle"></title><g id="vizg"></g></svg></div>
    <section class="panel">
      <p class="step-no" id="stepNo"></p>
      <h2 id="stepTitle"></h2>
      <div class="shape" id="stepShape"></div>
      <div id="stepBody"></div>
      <p class="src" id="stepSrc"></p>
    </section>
  </main>

  <nav class="spine" id="spine" aria-label="Чекори"></nav>

  <footer class="transport">
    <button id="prevM" title="Претходен модел (Shift+←)">‹‹</button>
    <button id="prev" title="Претходен чекор (←)">‹</button>
    <button id="play" title="Пушти / паузирај (Space)">▶</button>
    <button id="next" title="Следен чекор (→)">›</button>
    <button id="nextM" title="Следен модел (Shift+→)">››</button>
    <span class="count" id="count"></span>
    <span class="progress"><i id="bar"></i></span>
    <span class="speeds" role="group" aria-label="Брзина">
      <button data-s="0.6" aria-pressed="false">0.6×</button>
      <button data-s="1" aria-pressed="true">1×</button>
      <button data-s="1.6" aria-pressed="false">1.6×</button>
    </span>
  </footer>
</div>

<script>
"use strict";
const NS="http://www.w3.org/2000/svg";
const el=(n,a={})=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};
const add=(p,n,a)=>{const e=el(n,a);p.appendChild(e);return e;};
const txt=(p,x,y,s,cls,extra={})=>{const t=add(p,"text",Object.assign({x,y},extra));if(cls)t.setAttribute("class",cls);t.textContent=s;return t;};
const fmt=d=>"["+d.join(", ")+"]";

/* ── тензор како картичка: предната плоча е последните две оски,
      водечките оски се прикажани како наслагани копии ───────────── */
function tensor(g,{x,y,w,h,dims,color="var(--model)",d=0,dim2=null}){
  const grp=add(g,"g",{class:"fade",style:"--d:"+d});
  const n=dims.length;
  const rows=n>1?dims[n-2]:1, cols=dims[n-1];
  const R=Math.min(rows,10), C=Math.min(cols,22);
  const cw=Math.min((w-2)/C,(h-2)/R,18), ch=cw;
  const gw=C*cw, gh=R*ch;
  const ox=x+(w-gw)/2, oy=y+(h-gh)/2;
  /* наслагани копии за водечките оски */
  if(n>2){ for(let s=2;s>=1;s--) add(grp,"rect",{x:ox-s*5,y:oy-s*5,width:gw,height:gh,rx:2,
    fill:"var(--surface-2)",stroke:color,opacity:.35}); }
  add(grp,"rect",{x:ox,y:oy,width:gw,height:gh,rx:2,fill:color,opacity:.1,stroke:color});
  for(let r=0;r<R;r++)for(let c=0;c<C;c++)
    add(grp,"rect",{x:ox+c*cw+.7,y:oy+r*ch+.7,width:cw-1.4,height:ch-1.4,rx:1,fill:color,
      opacity:.16+((r*7+c*3)%5)*.1});
  if(cols>C) txt(grp,ox+gw+5,oy+gh/2+4,"…",null);
  if(rows>R) txt(grp,ox+gw/2-3,oy+gh+13,"⋮",null);
  txt(grp,x+w/2,y-8,fmt(dims),"big",{"text-anchor":"middle",style:"fill:"+color});
  if(n>1) txt(grp,ox-8,oy+gh/2+4,String(rows),null,{"text-anchor":"end"});
  txt(grp,ox+gw/2,oy+gh+(rows>R?26:15),String(cols),null,{"text-anchor":"middle"});
  if(dim2) txt(grp,x+w/2,y+h+28,dim2,null,{"text-anchor":"middle"});
  return grp;
}
function opBox(g,{x,y,w=210,h=54,lines,color="var(--model)",d=0}){
  const grp=add(g,"g",{class:"fade",style:"--d:"+d});
  add(grp,"rect",{x,y,width:w,height:h,rx:3,fill:"var(--surface-2)",stroke:color,"stroke-width":1.4});
  lines.forEach((l,i)=>txt(grp,x+w/2,y+(lines.length===1?h/2+4:20+i*15),l,i?null:"big",
    {"text-anchor":"middle",style:i?"":"fill:"+color}));
  return grp;
}
function arrow(g,x1,y,x2,d=0,color="var(--line)"){
  const grp=add(g,"g",{class:"fade",style:"--d:"+d});
  add(grp,"path",{d:`M${x1} ${y} H${x2-6}`,stroke:color,"stroke-width":1.5,fill:"none"});
  add(grp,"path",{d:`M${x2-10} ${y-4} l5 4 l-5 4`,stroke:color,"stroke-width":1.5,fill:"none"});
  return grp;
}
/* стандарден чекор: тензор → операција → тензор */
const flow=(inD,opLines,outD,capIn,capOut)=>g=>{
  tensor(g,{x:34,y:78,w:250,h:150,dims:inD,d:0,dim2:capIn});
  opBox(g,{x:340,y:126,w:220,h:56,lines:opLines,d:3});
  arrow(g,292,154,336,2); arrow(g,566,154,610,5);
  tensor(g,{x:616,y:78,w:250,h:150,dims:outD,d:6,dim2:capOut});
};

/* ── помошни цртежи ───────────────────────────────────────────── */
function heat(g,x,y,size,n,d=0,color="var(--model)",diag=false){
  const grp=add(g,"g",{class:"fade",style:"--d:"+d});
  const c=size/n;
  for(let r=0;r<n;r++)for(let q=0;q<n;q++){
    const v=diag?Math.exp(-Math.abs(r-q)/2.2):(((r*13+q*29)%17)/17)*.8+.1;
    add(grp,"rect",{x:x+q*c,y:y+r*c,width:c-.5,height:c-.5,fill:color,opacity:.08+v*.75});
  }
  add(grp,"rect",{x,y,width:size,height:size,fill:"none",stroke:color,opacity:.6});
  return grp;
}
function bars(g,x,y,w,h,vals,d=0,color="var(--model)",hi=[]){
  const grp=add(g,"g",{class:"fade",style:"--d:"+d});
  const m=Math.max(...vals), bw=w/vals.length;
  vals.forEach((v,i)=>add(grp,"rect",{x:x+i*bw,y:y+h-(v/m)*h,width:Math.max(1.5,bw-2),height:(v/m)*h,
    fill:hi.includes(i)?"var(--measured)":color,opacity:hi.includes(i)?1:.42,class:"grow",style:"--d:"+(d+i*.5)}));
  add(grp,"line",{x1:x,y1:y+h,x2:x+w,y2:y+h,class:"axis"});
  return grp;
}
function wave(n,seed=5,base=44,amp=26){
  let s=seed,o=[];const rnd=()=>(s=(s*1103515245+12345)&0x7fffffff)/0x7fffffff;
  for(let i=0;i<n;i++){const hh=i%24;o.push(Math.max(4,base+amp*(Math.sin((hh-8)/24*6.283)*.62+Math.sin((hh-4)/12*6.283)*.2)+(rnd()-.5)*amp*.3));}
  return o;
}
const line=(pts)=>pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");

/* ═══════════════ PatchTST ═══════════════ */
const PATCH=[
{t:"Влезен batch",sh:[["batch_x","[6, 24, 3]"]],dur:7,
 b:["Од <code>DataLoader</code> доаѓаат <b>6 прозорци</b> одеднаш (<code>batch_size = 6</code>). Секој прозорец е <b>24 последователни часа</b> со <b>3 канали</b>: <code>packets</code>, <code>bytes</code>, <code>users</code>.",
    "Каналот <code>users</code> е секогаш последен — целта."],
 s:"exp/exp_main.py · train()",
 draw:g=>{
   tensor(g,{x:60,y:70,w:280,h:170,dims:[6,24,3],d:0,dim2:"batch × часови × канали"});
   const ws=wave(24,7);
   const pts=ws.map((v,i)=>[440+i*16,220-(v/70)*110]);
   add(g,"path",{d:line(pts),fill:"none",stroke:"var(--model)","stroke-width":1.8,
     class:"pen",style:"--len:600;--d:4","stroke-dasharray":600});
   add(g,"line",{x1:436,y1:222,x2:840,y2:222,class:"axis"});
   txt(g,440,60,"еден прозорец, каналот users","lbl");
   txt(g,440,240,"час 0",null); txt(g,824,240,"час 23",null);
 }},
{t:"Каналите одат напред",sh:[["permute(0,2,1)","[6, 24, 3] → [6, 3, 24]"]],dur:6,
 b:["Сите операции подолу работат <b>по канал</b>, па временската оска мора да биде последна."],
 s:"models/PatchTST.py · Model.forward",
 draw:flow([6,24,3],["permute(0, 2, 1)","времето оди последно"],[6,3,24],"часови × канали","канали × часови")},
{t:"RevIN — нормализација по прозорец",sh:[["RevIN(norm)","[6, 3, 24] → [6, 3, 24]"]],dur:8,
 b:["Секој прозорец и секој канал се нормализираат <b>сами за себе</b>: се одзема средината и се дели со стандардната девијација на тие 24 часа.",
    "Затоа <code>scale = False</code> во <code>run.py</code> е безбедно — станица со 500 корисници и станица со 20 влегуваат во моделот во иста скала, а излезот се враќа во сурови единици на крајот.",
    "<code>affine = 0</code>: нема учени параметри во нормализацијата."],
 s:"layers/RevIN.py · PatchTST_backbone.forward",
 draw:g=>{
   const raw=wave(24,3,52,30), mu=raw.reduce((a,b)=>a+b)/24;
   const sd=Math.sqrt(raw.reduce((a,b)=>a+(b-mu)**2,0)/24);
   const p1=raw.map((v,i)=>[70+i*13,180-(v/90)*95]);
   const p2=raw.map((v,i)=>[560+i*13,145-((v-mu)/sd)*26]);
   txt(g,70,54,"сурово","lbl"); txt(g,560,54,"нормализирано","lbl");
   add(g,"path",{d:line(p1),fill:"none",stroke:"var(--muted)","stroke-width":1.7,class:"pen",style:"--len:500;--d:0","stroke-dasharray":500});
   add(g,"line",{x1:66,y1:182,x2:392,y2:182,class:"axis"});
   add(g,"line",{x1:66,y1:180-(mu/90)*95,x2:392,y2:180-(mu/90)*95,stroke:"var(--measured)","stroke-dasharray":"4 3","stroke-width":1.2,class:"fade",style:"--d:3"});
   txt(g,396,184-(mu/90)*95,"μ",null,{style:"fill:var(--measured)"});
   opBox(g,{x:410,y:118,w:130,h:54,lines:["(x − μ) / σ","по прозорец"],d:5});
   add(g,"path",{d:line(p2),fill:"none",stroke:"var(--model)","stroke-width":1.7,class:"pen",style:"--len:500;--d:6","stroke-dasharray":500});
   add(g,"line",{x1:556,y1:145,x2:882,y2:145,stroke:"var(--measured)","stroke-dasharray":"4 3","stroke-width":1.2,class:"fade",style:"--d:8"});
   txt(g,886,148,"0",null,{style:"fill:var(--measured)"});
   txt(g,70,236,"истата форма, но центрирана на нула и со единечна дисперзија","lbl");
   txt(g,70,258,"μ и σ се памтат за да се врати предвидувањето во број на корисници",null);
 }},
{t:"Дополнување на крајот",sh:[["ReplicationPad1d((0, 1))","[6, 3, 24] → [6, 3, 25]"]],dur:6,
 b:["Последната вредност се повторува еднаш. Без тоа, последниот час би влегол во помалку закрпи од другите и крајот на прозорецот — токму делот најблизок до она што се предвидува — би бил потценет."],
 s:"PatchTST_backbone · padding_patch = 'end'",
 draw:flow([6,3,24],["ReplicationPad1d((0, 1))","се повторува последниот час"],[6,3,25],"24 часа","25 — последниот е удвоен")},
{t:"Закрпување — 20 преклопувачки прозорчиња",sh:[["unfold(-1, 6, 1)","[6, 3, 25] → [6, 3, 20, 6]"]],dur:9,
 b:["Со <code>patch_len = 6</code> и <code>stride = 1</code> низата се сече на <b>20 закрпи од по 6 часа</b>, секоја поместена за еден час.",
    "Ова е клучната идеја на PatchTST: токен не е <b>еден час</b>, туку <b>шест</b>. Вниманието работи со 20 токени наместо 24, а секој токен веќе носи локален облик — раст, пад, врв."],
 s:"PatchTST_backbone.forward",
 draw:g=>{
   const x0=60,bw=30;
   txt(g,x0,52,"25 часа по дополнувањето","lbl");
   for(let i=0;i<25;i++) add(g,"rect",{x:x0+i*bw,y:62,width:bw-3,height:22,rx:2,
     fill:"var(--model)",opacity:i===24?.22:.4,class:"grow",style:"--d:"+(i*.35)});

const MODELS=[
 {id:"patchtst",name:"PatchTST",c:"var(--m1)",src:"models/PatchTST.py · layers/PatchTST_backbone.py",steps:PATCH},
 {id:"cats",name:"CATS",c:"var(--m2)",src:"models/CATS.py",steps:CATS},
 {id:"deformable",name:"DeformableTST",c:"var(--m3)",src:"models/DeformableTST.py · layers/Global_Attn.py",steps:DEF},
 {id:"perimid",name:"Peri-midFormer",c:"var(--m4)",src:"models/PerimidFormer.py · layers/PerimidFormer_EncDec.py",steps:PERI}
];

/* ── плеер ────────────────────────────────────────────────────── */
const FLAT=[];
MODELS.forEach((m,mi)=>m.steps.forEach((s,si)=>FLAT.push({m,mi,s,si})));

const vizg=document.getElementById("vizg"), vizTitle=document.getElementById("vizTitle");
const tabs=document.getElementById("tabs"), spine=document.getElementById("spine");
const stepNo=document.getElementById("stepNo"), stepTitle=document.getElementById("stepTitle");
const stepShape=document.getElementById("stepShape"), stepBody=document.getElementById("stepBody");
const stepSrc=document.getElementById("stepSrc"), bar=document.getElementById("bar");
const count=document.getElementById("count"), playBtn=document.getElementById("play");
let i=-1, playing=false, speed=1, t0=0, raf=0;

MODELS.forEach((m,mi)=>{
  const b=document.createElement("button");
  b.textContent=m.name; b.style.setProperty("--c",m.c);
  b.addEventListener("click",()=>{ go(FLAT.findIndex(f=>f.mi===mi)); });
  tabs.appendChild(b);
});
const tabBtns=[...tabs.children];

function buildSpine(mi){
  spine.textContent="";
  MODELS[mi].steps.forEach((s,si)=>{
    const b=document.createElement("button");
    b.title=(si+1)+". "+s.t;
    b.addEventListener("click",()=>go(FLAT.findIndex(f=>f.mi===mi&&f.si===si)));
    spine.appendChild(b);
  });
}
function go(n){
  n=(n+FLAT.length)%FLAT.length;
  if(n===i) return;
  const prevMi = i>=0 ? FLAT[i].mi : -1;
  i=n;
  const {m,mi,s,si}=FLAT[i];
  document.documentElement.style.setProperty("--model",m.c);
  if(mi!==prevMi) buildSpine(mi);
  tabBtns.forEach((b,k)=>b.setAttribute("aria-current",k===mi?"true":"false"));
  [...spine.children].forEach((b,k)=>{
    b.setAttribute("aria-current",k===si?"true":"false");
    b.classList.toggle("done",k<si);
  });
  stepNo.textContent=m.name+" · чекор "+(si+1)+" од "+m.steps.length;
  stepTitle.textContent=s.t;
  stepShape.textContent="";
  s.sh.forEach(([k,v])=>{
    const a=document.createElement("span"); a.textContent=k;
    const b2=document.createElement("b"); b2.textContent=v;
    stepShape.append(a,b2);
  });
  stepBody.textContent="";
  s.b.forEach(html=>{ const p=document.createElement("p"); p.className="body"; p.innerHTML=html; stepBody.appendChild(p); });
  stepSrc.textContent=s.s;
  vizTitle.textContent=m.name+" — "+s.t;
  vizg.textContent="";
  void vizg.offsetWidth;
  s.draw(vizg);
  count.textContent=String(i+1).padStart(2,"0")+" / "+FLAT.length;
  t0=performance.now(); bar.style.width="0%";
}
const dur=()=>(FLAT[i].s.dur||8)*1000/speed;
function tick(now){
  if(!playing) return;
  const p=Math.min(1,(now-t0)/dur());
  bar.style.width=(p*100).toFixed(2)+"%";
  if(p>=1) go(i+1);
  raf=requestAnimationFrame(tick);
}
function play(){ playing=true; playBtn.textContent="❙❙"; t0=performance.now(); cancelAnimationFrame(raf); raf=requestAnimationFrame(tick); }
function pause(){ playing=false; playBtn.textContent="▶"; cancelAnimationFrame(raf); }
playBtn.addEventListener("click",()=>playing?pause():play());
document.getElementById("prev").addEventListener("click",()=>{go(i-1);t0=performance.now();});
document.getElementById("next").addEventListener("click",()=>{go(i+1);t0=performance.now();});
document.getElementById("prevM").addEventListener("click",()=>{
  const mi=FLAT[i].mi; go(FLAT.findIndex(f=>f.mi===(mi+MODELS.length-1)%MODELS.length)); t0=performance.now(); });
document.getElementById("nextM").addEventListener("click",()=>{
  const mi=FLAT[i].mi; go(FLAT.findIndex(f=>f.mi===(mi+1)%MODELS.length)); t0=performance.now(); });
document.querySelectorAll(".speeds button").forEach(b=>{
  b.addEventListener("click",()=>{
    speed=parseFloat(b.dataset.s);
    document.documentElement.style.setProperty("--u",(1/speed)+"s");
    document.querySelectorAll(".speeds button").forEach(o=>o.setAttribute("aria-pressed",String(o===b)));
    t0=performance.now();
  });
});
addEventListener("keydown",e=>{
  if(e.target instanceof Element && e.target.matches("button") && e.key===" ") return;
  if(e.key===" "){ e.preventDefault(); playing?pause():play(); }
  else if(e.key==="ArrowRight"){ e.shiftKey?document.getElementById("nextM").click():(go(i+1),t0=performance.now()); }
  else if(e.key==="ArrowLeft"){ e.shiftKey?document.getElementById("prevM").click():(go(i-1),t0=performance.now()); }
  else if(e.key==="Home"){ go(0); }
});
go(0); play();
</script>
